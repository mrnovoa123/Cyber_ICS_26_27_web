ganismo competente.","<b>Filtro de confidencialidad<\/b> antes de cifrar y enviar: nombres, terceros, detalles reproducibles, especulación sobre autoría.","La IA interpreta al funcionario que responde con un requerimiento de ampliación."],"ctrl":"Doble redacción con marcadores [N] afectados, [SERVICIO], [FECHA]. Los datos reales entran en local y al final, nunca al revés."}},{"n":"5.4","t":"Análise de impacto","ca":"CA5.4 · Notificación a afectados (3 h)","obj":"Evaluar el impacto y comunicar a los afectados adecuadamente.","tools":["Datos del SIEM / registro","Matriz de impacto","Plantillas RGPD"],"steps":["Evaluar el impacto sobre sistemas, datos y servicios; estimar alcance.","Priorizar incidentes/afectados por gravedad e impacto.","Redactar la comunicación formal a los afectados (clara, honesta, con medidas) y enviarla al buzón."],"deliver":"Informe de análisis de impacto + lista priorizada + comunicación a afectados.","amp":"Dos versiones de la comunicación (técnica para proveedores, sencilla para clientes) y evaluar cuál cumple el RGPD.","ia":{"ruta":["La IA propone la matriz de impacto y una priorización; el alumnado la ajusta al caso y justifica cada cambio.","El entregable lleva las dos versiones en paralelo: la de la IA y la corregida.","Las cifras de alcance salen del SIEM y del registro, nunca de la estimación de la IA."],"ctrl":"Todo número de la comunicación apunta a la consulta del SIEM o al campo del registro que lo respalda."}},{"n":"5.5","t":"Leccións aprendidas e mellora","ca":"CA5.5 · Medios y mejora (3 h)","obj":"Cerrar la gestión comunicativa y mejorar el proceso.","tools":["Plantilla de comunicado / portavocía","BookStack / Moodle","Retrospectiva"],"steps":["Decidir si procede informar a medios y redactar, si aplica, un comunicado medido.","Informe final de lecciones sobre la comunicación (qué funcionó, tiempos).","Plan de mejora de los procedimientos; archivar en la base de conocimiento."],"deliver":"Informe final de lecciones + plan de mejora de notificación + (si procede) comunicado público.","amp":"Simulacro de rueda de prensa / preguntas difíciles; analizar un caso real de gestión de una brecha.","ia":{"ruta":["La IA interpreta a un periodista incisivo: cuántos afectados, por qué no se dijo antes, si van a pagar. Tres rondas, la segunda sin preparación previa.","<b>Prueba de la frase concreta<\/b>: se subraya todo lo que podría aparecer en el comunicado de cualquier otra empresa, y se elimina.","Informe final de lecciones sobre la comunicación y plan de mejora."],"ctrl":"Tres lecturas con tres preguntas distintas: ¿hay algún hecho no confirmado?, ¿alguna frase admite culpa sin base?, ¿se entiende sin saber informática?"}}]}],"LAB_TASKS":{"1":{"t":"Laboratorio integrado · Normativa del puesto y detección de alucinaciones normativas","escenario":"Como responsable de seguridad de TecnoMariña S.L., elaboras la Normativa de Protección del Puesto de Trabajo. Usas un LLM comercial para un primer borrador exhaustivo (autenticación, teletrabajo, bloqueo de pantalla, uso de IA generativa) y auditas cada control frente al ENS (RD 311/2022), detectando y corrigiendo las alucinaciones normativas.","elementos":["Enunciado de contexto de TecnoMariña S.L.","Asistente de IA en la nube (nivel verde)","Texto oficial del RD 311/2022 (ENS) y guías CCN-STIC"],"entregable":"Normativa del puesto corregida + tabla de trazabilidad + bitácora de prompts.","fases":["Generación inicial","Auditoría de afirmaciones","Tratamiento de discrepancias","Cláusula de IA","Entrega"]},"2":{"t":"Laboratorio integrado · Triaje en Wazuh y mitigación de prompt injection en logs","escenario":"Desde kali se lanza tráfico web hacia srvweb con una carga que intenta engañar al analista mediante instrucciones inyectadas en las cabeceras HTTP. El alumnado exporta las alertas de Wazuh, las somete a triaje asistido por IA, detecta la manipulación y crea una regla de detección.","elementos":["Máquinas siem, srvweb y kali activas","Panel Wazuh en https://10.10.10.10"],"entregable":"Ficha del incidente + regla local de Wazuh + bitácora con los dos triajes (vulnerable y mitigado).","fases":["Lanzamiento","Extracción","Comprobar la vulnerabilidad","Aislamiento de contexto","Regla de detección"]},"3":{"t":"Laboratorio integrado · Cadena de custodia (RFC 3227) y desofuscación con IA local","escenario":"Un atacante ha ejecutado un comando ofuscado en PowerShell en win10. Siguiendo el RFC 3227, se extrae la evidencia, se mantiene la cadena de custodia sin exponer datos a la nube y se analiza el código con un LLM local (Ollama) para mapearlo a MITRE ATT&CK.","elementos":["win10 con Sysmon (Event ID 1: creación de procesos)","CyberChef para decodificación","IA local: <code>ollama run llama3.2:3b<\/code> o <code>qwen2.5:3b<\/code>","Formulario de cadena de custodia"],"entregable":"Informe forense pericial + hoja de custodia + bitácora de IA local.","fases":["Preservación (evidencia roja)","Decodificación manual","Análisis asistido local","Verificación de artefactos","Entrega"]},"4":{"t":"Laboratorio integrado · Playbook ante ransomware y resiliencia con Restic","escenario":"Desarrollas un playbook técnico ante ransomware siguiendo NIST SP 800-61 para TecnoMariña S.L. Configuras en srvweb copias 3-2-1 con Restic, simulas un cifrado y mides experimentalmente el RTO y el RPO.","elementos":["srvweb con el paquete restic instalado","Guía NIST SP 800-61 y Wazuh FIM (syscheck)"],"entregable":"Playbook validado por ejecución ciega + informe de RTO/RPO + evidencia FIM.","fases":["Generación con IA","Parametrización local","Despliegue de copias","Simulación y restauración","Comprobación FIM"]},"5":{"t":"Laboratorio integrado · Notificación de brecha y gestión comunicativa de crisis","escenario":"Tras una fuga de datos personales en el portal municipal, se activan los procedimientos de notificación según el RGPD (72 h). Se usa la IA para adaptar el incidente a cuatro registros comunicativos con el protocolo de doble redacción y se realiza un simulacro de rueda de prensa.","elementos":["Buzón MailHog en siem (http://10.10.10.10:8025)","Formulario de notificación de brechas de la AEPD / INCIBE-CERT"],"entregable":"Notificación formal + protocolo de doble redacción + registro de comunicaciones.","fases":["Doble redacción","Adaptación multi-audiencia","Desanonimización y prueba SMTP","Rueda de prensa","Entrega"]}},"MANUAL":{"files":{"Vagrantfile":"# labcyber/Vagrantfile — Laboratorio MP5021 (TecnoMariña S.L.)\nWAZUH_BRANCH    = \"4.14\"      # rama del instalador (packages.wazuh.com/<rama>/)\nWAZUH_AGENT_VER = \"4.14.0-1\"  # versión exacta del agente, igual o menor que el manager\nLAN             = \"labcyber-lan\"\n\nVagrant.configure(\"2\") do |config|\n  config.vm.box_check_update = false\n  config.vm.boot_timeout     = 900\n\n  # ---------- SIEM: Wazuh + Suricata ----------\n  config.vm.define \"siem\", primary: true do |m|\n    m.vm.box      = \"bento/ubuntu-22.04\"\n    m.vm.hostname = \"siem\"\n    m.vm.network \"private_network\", ip: \"10.10.10.10\", virtualbox__intnet: LAN\n    m.vm.network \"private_network\", ip: \"192.168.56.10\"\n    m.vm.provider \"virtualbox\" do |vb|\n      vb.name   = \"lab-siem\"\n      vb.memory = 5120\n      vb.cpus   = 2\n      vb.customize [\"modifyvm\", :id, \"--nicpromisc2\", \"allow-all\"]  # Suricata ve toda la LAN\n    end\n    m.vm.provision \"shell\", path: \"provision/siem.sh\", args: [WAZUH_BRANCH]\n  end\n\n  # ---------- SRVWEB: víctima LAMP ----------\n  config.vm.define \"srvweb\" do |m|\n    m.vm.box      = \"bento/ubuntu-22.04\"\n    m.vm.hostname = \"srvweb\"\n    m.vm.network \"private_network\", ip: \"10.10.10.30\", virtualbox__intnet: LAN\n    m.vm.network \"private_network\", ip: \"192.168.56.30\"\n    m.vm.provider \"virtualbox\" do |vb|\n      vb.name   = \"lab-srvweb\"\n      vb.memory = 1024\n      vb.cpus   = 1\n    end\n    m.vm.provision \"shell\", path: \"provision/srvweb.sh\", args: [WAZUH_AGENT_VER]\n  end\n\n  # ---------- WIN10: víctima Windows ----------\n  config.vm.define \"win10\", autostart: false do |m|\n    m.vm.box          = \"gusztavvargadr/windows-10\"\n    m.vm.hostname     = \"win10\"\n    m.vm.guest        = :windows\n    m.vm.communicator = \"winrm\"\n    m.vm.network \"private_network\", ip: \"10.10.10.20\", virtualbox__intnet: LAN\n    m.vm.network \"private_network\", ip: \"192.168.56.20\"\n    m.vm.provider \"virtualbox\" do |vb|\n      vb.name   = \"lab-win10\"\n      vb.memory = 3072\n      vb.cpus   = 2\n      vb.gui    = true\n    end\n    m.vm.provision \"shell\", path: \"provision/win10.ps1\", args: [WAZUH_AGENT_VER]\n  end\n\n  # ---------- KALI: atacante ----------\n  config.vm.define \"kali\" do |m|\n    m.vm.box      = \"kalilinux/rolling\"\n    m.vm.hostname = \"kali\"\n    m.vm.network \"private_network\", ip: \"10.10.10.100\", virtualbox__intnet: LAN\n    m.vm.network \"private_network\", ip: \"192.168.56.100\"\n    m.vm.provider \"virtualbox\" do |vb|\n      vb.name   = \"lab-kali\"\n      vb.memory = 2048\n      vb.cpus   = 2\n      vb.gui    = true\n    end\n    m.vm.provision \"shell\", path: \"provision/kali.sh\"\n  end\nend\n","siem.sh":"#!/usr/bin/env bash\n# provision/siem.sh — Wazuh all-in-one + Suricata\nset -euo pipefail\nBRANCH=\"${1:-4.14}\"\nexport DEBIAN_FRONTEND=noninteractive\nLAN_IF=$(ip -o -4 addr show | awk '/ 10\\.10\\.10\\./{print $2; exit}')\n\napt-get update\napt-get install -y curl software-properties-common\n\n# --- 1. Wazuh (indexer + manager + dashboard en una sola VM) ---\ncd /root\ncurl -sO \"https://packages.wazuh.com/${BRANCH}/wazuh-install.sh\"\nbash ./wazuh-install.sh -a -i | tee /root/wazuh-install.log   # -i: omite la comprobación de requisitos\ntar -O -xf wazuh-install-files.tar wazuh-install-files/wazuh-passwords.txt > /vagrant/wazuh-passwords.txt\n\n# --- 2. Suricata escuchando en la LAN del laboratorio ---\nadd-apt-repository -y ppa:oisf/suricata-stable\napt-get update\napt-get install -y suricata\nCONF=/etc/suricata/suricata.yaml\nsed -i \"s|^\\(\\s*HOME_NET:\\).*|\\1 \\\"[10.10.10.0/24]\\\"|\" \"$CONF\"\nsed -i \"s|interface: eth0|interface: ${LAN_IF}|g\" \"$CONF\"\n[ -f /etc/default/suricata ] && sed -i \"s|^IFACE=.*|IFACE=${LAN_IF}|\" /etc/default/suricata\n\n# Reglas propias para las prácticas\nmkdir -p /etc/suricata/rules\ncat > /etc/suricata/rules/local.rules <<'EOF'\nalert icmp any any -> $HOME_NET any (msg:\"LAB ICMP echo hacia la LAN\"; itype:8; sid:1000001; rev:1;)\nalert tcp any any -> $HOME_NET 22 (msg:\"LAB intento de conexion SSH\"; flags:S; sid:1000002; rev:1;)\nEOF\ngrep -q local.rules \"$CONF\" || sed -i 's|^\\(\\s*\\)- suricata.rules|\\1- suricata.rules\\n\\1- /etc/suricata/rules/local.rules|' \"$CONF\"\nsuricata-update\nsystemctl enable suricata && systemctl restart suricata\n\n# --- 3. Wazuh lee las alertas de Suricata ---\ngrep -q suricata/eve.json /var/ossec/etc/ossec.conf || cat >> /var/ossec/etc/ossec.conf <<'EOF'\n\n<ossec_config>\n  <localfile>\n    <log_format>json<\/log_format>\n    <location>/var/log/suricata/eve.json<\/location>\n  <\/localfile>\n<\/ossec_config>\nEOF\nsystemctl restart wazuh-manager\necho \"SIEM listo: https://192.168.56.10 (credenciales en labcyber/wazuh-passwords.txt)\"\n","srvweb.sh":"#!/usr/bin/env bash\n# provision/srvweb.sh — LAMP + DVWA + usuario débil SSH + agente Wazuh\nset -euo pipefail\nAGENT_VER=\"${1:-4.14.0-1}\"\nexport DEBIAN_FRONTEND=noninteractive\n\n# --- 1. Pila LAMP ---\napt-get update\napt-get install -y apache2 mariadb-server php php-mysqli php-gd libapache2-mod-php git curl gnupg\n\n# --- 2. DVWA (instalada en Apache, no en contenedor) ---\n[ -d /var/www/html/dvwa ] || git clone --depth 1 https://github.com/digininja/DVWA.git /var/www/html/dvwa\ncp /var/www/html/dvwa/config/config.inc.php.dist /var/www/html/dvwa/config/config.inc.php\nmysql -e \"CREATE DATABASE IF NOT EXISTS dvwa;\n  CREATE USER IF NOT EXISTS 'dvwa'@'localhost' IDENTIFIED BY 'p@ssw0rd';\n  GRANT ALL ON dvwa.* TO 'dvwa'@'localhost'; FLUSH PRIVILEGES;\"\nsed -i 's/^allow_url_include = .*/allow_url_include = On/' /etc/php/*/apache2/php.ini\nchown -R www-data:www-data /var/www/html/dvwa\nsystemctl restart apache2\n\n# --- 3. Usuario con contraseña débil para la fuerza bruta SSH ---\nid empleado &>/dev/null || useradd -m -s /bin/bash empleado\necho 'empleado:123456' | chpasswd\necho 'PasswordAuthentication yes' > /etc/ssh/sshd_config.d/00-lab.conf\nsystemctl restart ssh\n\n# --- 4. Agente Wazuh (misma versión o menor que el manager) ---\ncurl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | gpg --no-default-keyring --keyring gnupg-ring:/usr/share/keyrings/wazuh.gpg --import\nchmod 644 /usr/share/keyrings/wazuh.gpg\necho \"deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main\" > /etc/apt/sources.list.d/wazuh.list\napt-get update\nWAZUH_MANAGER=\"10.10.10.10\" WAZUH_AGENT_NAME=\"srvweb\" apt-get install -y \"wazuh-agent=${AGENT_VER}\"\napt-mark hold wazuh-agent\n\n# Logs de Apache hacia Wazuh\ngrep -q apache2/access.log /var/ossec/etc/ossec.conf || cat >> /var/ossec/etc/ossec.conf <<'EOF'\n\n<ossec_config>\n  <localfile>\n    <log_format>apache<\/log_format>\n    <location>/var/log/apache2/access.log<\/location>\n  <\/localfile>\n  <localfile>\n    <log_format>apache<\/log_format>\n    <location>/var/log/apache2/error.log<\/location>\n  <\/localfile>\n<\/ossec_config>\nEOF\nsystemctl daemon-reload\nsystemctl enable --now wazuh-agent\necho \"srvweb listo: http://192.168.56.30/dvwa/setup.php\"\n","win10.ps1":"# provision/win10.ps1 — Sysmon + agente Wazuh\nparam([string]$AgentVer = \"4.14.0-1\")\n$ErrorActionPreference = \"Stop\"\n[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12\n$tmp = \"C:\\lab\"; New-Item -ItemType Directory -Force $tmp | Out-Null\n\n# --- 1. Permitir ping desde la LAN del laboratorio ---\nif (-not (Get-NetFirewallRule -DisplayName \"LAB ICMPv4 entrada\" -ErrorAction SilentlyContinue)) {\n  New-NetFirewallRule -DisplayName \"LAB ICMPv4 entrada\" -Protocol ICMPv4 -IcmpType 8 `\n    -Direction Inbound -Action Allow -RemoteAddress 10.10.10.0/24 | Out-Null\n}\n\n# --- 2. Sysmon con la configuración de SwiftOnSecurity ---\nInvoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile \"$tmp\\Sysmon.zip\" -UseBasicParsing\nExpand-Archive \"$tmp\\Sysmon.zip\" -DestinationPath \"$tmp\\Sysmon\" -Force\nInvoke-WebRequest https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml -OutFile \"$tmp\\sysmonconfig.xml\" -UseBasicParsing\n& \"$tmp\\Sysmon\\Sysmon64.exe\" -accepteula -i \"$tmp\\sysmonconfig.xml\"\n\n# --- 3. Agente Wazuh ---\nInvoke-WebRequest \"https://packages.wazuh.com/4.x/windows/wazuh-agent-$AgentVer.msi\" -OutFile \"$tmp\\wazuh-agent.msi\" -UseBasicParsing\nStart-Process msiexec.exe -Wait -ArgumentList \"/i $tmp\\wazuh-agent.msi /q WAZUH_MANAGER=10.10.10.10 WAZUH_AGENT_NAME=win10\"\n\n# Eventos de Sysmon hacia Wazuh\n$conf = \"C:\\Program Files (x86)\\ossec-agent\\ossec.conf\"\nif (-not (Select-String -Path $conf -Pattern \"Sysmon/Operational\" -Quiet)) {\n  Add-Content $conf @\"\n\n<ossec_config>\n  <localfile>\n    <location>Microsoft-Windows-Sysmon/Operational<\/location>\n    <log_format>eventchannel<\/log_format>\n  <\/localfile>\n<\/ossec_config>\n\"@\n}\nRestart-Service WazuhSvc -ErrorAction SilentlyContinue\nif ((Get-Service WazuhSvc).Status -ne \"Running\") { Start-Service WazuhSvc }\nWrite-Host \"win10 lista\"\n","kali.sh":"#!/usr/bin/env bash\n# provision/kali.sh — herramientas del atacante\nset -euo pipefail\nexport DEBIAN_FRONTEND=noninteractive\n\n# Clave del repositorio de Kali (las boxes antiguas traen la clave caducada)\nwget -q https://archive.kali.org/archive-keyring.gpg -O /usr/share/keyrings/kali-archive-keyring.gpg\n\napt-get update\napt-get install -y -o Dpkg::Options::=\"--force-confold\" \\\n  nmap hydra hping3 sqlmap nikto wordlists curl tcpdump\n\n# Diccionario rockyou descomprimido (t2.3)\n[ -f /usr/share/wordlists/rockyou.txt ] || gunzip -k /usr/share/wordlists/rockyou.txt.gz\n\n# Nombres de las máquinas del laboratorio\ngrep -q \"10.10.10.30  srvweb\" /etc/hosts || cat >> /etc/hosts <<'EOF'\n10.10.10.10  siem\n10.10.10.20  win10\n10.10.10.30  srvweb\nEOF\necho \"kali listo\"\n"},"vms":[["siem","Wazuh all-in-one + Suricata","bento/ubuntu-22.04","10.10.10.10","192.168.56.10","5 GB / 2"],["srvweb","Víctima LAMP + DVWA","bento/ubuntu-22.04","10.10.10.30","192.168.56.30","1 GB / 1"],["win10","Víctima Windows + Sysmon","gusztavvargadr/windows-10","10.10.10.20","192.168.56.20","3 GB / 2"],["kali","Atacante / forense","kalilinux/rolling","10.10.10.100","192.168.56.100","2 GB / 2"]],"install":[["bash","anfitrión Ubuntu/Debian — instalar Vagrant","wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg\necho \"deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main\" | sudo tee /etc/apt/sources.list.d/hashicorp.list\nsudo apt update && sudo apt install -y vagrant"],["check","comprobar la instalación","vagrant --version\nVBoxManage --version"],["hyperv","anfitrión Windows — PowerShell como administrador, y reiniciar","bcdedit /set hypervisorlaunchtype off\nDisable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All"],["boxes","descargar las boxes con antelación","vagrant box add bento/ubuntu-22.04 --provider virtualbox\nvagrant box add kalilinux/rolling --provider virtualbox\nvagrant box add gusztavvargadr/windows-10 --provider virtualbox"]],"cmds":[["vagrant status","Estado de cada VM (running, poweroff, not created)"],["vagrant up siem","Crea o arranca siem; la primera vez también la provisiona"],["vagrant ssh kali","Abre una sesión SSH en kali"],["vagrant halt srvweb","Apaga srvweb ordenadamente"],["vagrant reload siem","Reinicia y aplica cambios de red/RAM del Vagrantfile"],["vagrant provision srvweb","Vuelve a ejecutar los scripts de configuración"],["vagrant snapshot save siem base","Guarda una instantánea llamada base"],["vagrant snapshot restore siem base","Vuelve a esa instantánea"],["vagrant snapshot list","Lista las instantáneas"],["vagrant destroy -f win10","Borra la VM (la box sigue descargada)"],["vagrant box list / vagrant box prune","Lista boxes / borra versiones antiguas"],["vagrant global-status --prune","Todas las VMs de Vagrant del equipo"]],"first":"vagrant init bento/ubuntu-22.04   # crea un Vagrantfile mínimo\nvagrant up                        # descarga la box si falta y arranca la VM\nvagrant ssh                       # entra en la VM (usuario vagrant)\nexit\nvagrant destroy -f                # borra la VM","tree":"labcyber/\n├── Vagrantfile\n├── README.md\n└── provision/\n    ├── siem.sh      # Wazuh all-in-one + Suricata\n    ├── srvweb.sh    # LAMP + DVWA + agente Wazuh + usuario débil SSH\n    ├── win10.ps1    # Sysmon + agente Wazuh\n    └── kali.sh      # herramientas y diccionarios","per":[{"n":"siem","t":"Wazuh all-in-one + Suricata","ca":"provision/siem.sh · 15–25 min","file":"siem.sh","steps":["Levanta la máquina: <code>vagrant up siem<\/code>. El instalador de Wazuh es la parte lenta.","Al terminar aparece <code>wazuh-passwords.txt<\/code> en la carpeta <code>labcyber/<\/code> del anfitrión. Busca el usuario <code>admin<\/code>.","Abre <span class=\"mono ip\">https://192.168.56.10<\/span> en el navegador del anfitrión, acepta el certificado autofirmado y entra con <code>admin<\/code>.","Comprueba los servicios con los comandos de abajo."],"check":"vagrant ssh siem\nsudo systemctl status wazuh-manager wazuh-indexer wazuh-dashboard suricata --no-pager\nsudo suricata -T -c /etc/suricata/suricata.yaml    # \"Configuration provided was successfully loaded\"\nip -br a                                           # nombre real de la interfaz 10.10.10.10","note":"El fichero <code>wazuh-passwords.txt<\/code> contiene las credenciales del laboratorio: no lo compartas ni lo subas a ningún repositorio."},{"n":"srvweb","t":"LAMP + DVWA + agente Wazuh","ca":"provision/srvweb.sh · 5 min","file":"srvweb.sh","steps":["Con <code>siem<\/code> ya en marcha: <code>vagrant up srvweb<\/code>.","Desde el anfitrión abre <span class=\"mono ip\">http://192.168.56.30/dvwa/setup.php<\/span> y pulsa <b>Create / Reset Database<\/b>.","Entra en <span class=\"mono ip\">http://192.168.56.30/dvwa/<\/span> con <code>admin<\/code> / <code>password<\/code> y ajusta <b>DVWA Security<\/b> al nivel de la actividad.","Comprueba desde <code>siem<\/code> que el agente se ha registrado."],"check":"vagrant ssh siem -c \"sudo /var/ossec/bin/agent_control -l\"   # debe listar srvweb como Active","note":"DVWA es una aplicación vulnerable a propósito: solo debe estar accesible dentro de la red del laboratorio."},{"n":"win10","t":"Víctima Windows con Sysmon y agente Wazuh","ca":"provision/win10.ps1 · 20–30 min","file":"win10.ps1","steps":["<code>vagrant up win10<\/code>. Se abre la ventana de la VM; usuario <code>vagrant<\/code> / <code>vagrant<\/code>.","Comprueba en PowerShell dentro de la VM con los comandos de abajo.","En el panel de Wazuh, <b>Agents<\/b> debe mostrar <code>win10<\/code> activo, y en <b>Threat Hunting<\/b> aparecen eventos de <code>Microsoft-Windows-Sysmon<\/code>."],"check":"ipconfig | findstr 10.10.10          # debe mostrar 10.10.10.20\nGet-Service Sysmon64, WazuhSvc      # ambos Running\nGet-WinEvent -LogName \"Microsoft-Windows-Sysmon/Operational\" -MaxEvents 5","note":"La box usa una licencia de evaluación que caduca. Si deja de activarse: <code>vagrant destroy -f win10<\/code> y volver a crearla."},{"n":"kali","t":"Atacante","ca":"provision/kali.sh · 10–15 min","file":"kali.sh","steps":["<code>vagrant up kali<\/code>. Se abre el escritorio Xfce; usuario <code>vagrant<\/code> / <code>vagrant<\/code>.","Comprueba conectividad y herramientas desde un terminal de Kali.","No se hace <code>apt full-upgrade<\/code> en clase: descarga varios GB y rompe la homogeneidad entre puestos."],"check":"ip -br a                          # 10.10.10.100 en una interfaz\nping -c 2 srvweb\nnmap -sV 10.10.10.30              # 22/ssh y 80/http abiertos\nls -lh /usr/share/wordlists/rockyou.txt","note":"El script reinstala la clave del repositorio de Kali porque las boxes antiguas la traen caducada y <code>apt update<\/code> falla."}],"start":"cd labcyber\nvagrant validate          # revisa la sintaxis del Vagrantfile\nvagrant up siem           # 1º el manager\nvagrant up srvweb kali    # 2º víctima Linux y atacante\nvagrant up win10          # 3º solo si el puesto va sobrado o la actividad lo pide\nvagrant status","e2e":[["1","kali","<code>ping -c 3 10.10.10.10<\/code> y <code>ping -c 3 10.10.10.30<\/code>","Responden todas las IPs de la LAN"],["2","siem","<code>sudo /var/ossec/bin/agent_control -l<\/code>","<code>srvweb<\/code> (y <code>win10<\/code>) en estado Active"],["3","kali","<code>sudo hping3 --icmp --fast -c 20 10.10.10.30<\/code>","Alertas de Suricata en Wazuh: «LAB ICMP echo hacia la LAN»"],["4","kali","<code>hydra -l empleado -P /usr/share/wordlists/rockyou.txt -t 4 ssh://10.10.10.30<\/code>","Wazuh registra las autenticaciones fallidas y la alerta de fuerza bruta SSH en <code>srvweb<\/code>"]],"snap":"vagrant halt\nvagrant snapshot save siem   base-limpia\nvagrant snapshot save srvweb base-limpia\nvagrant snapshot save kali   base-limpia\nvagrant snapshot save win10  base-limpia\n\n# Al terminar una práctica\nvagrant snapshot restore srvweb base-limpia","iso":"VBoxManage controlvm lab-srvweb setlinkstate1 off   # desconecta la NAT\nVBoxManage controlvm lab-srvweb setlinkstate1 on    # la vuelve a conectar","trouble":[["<code>VT-x is not available<\/code> o la VM no arranca","Virtualización desactivada en BIOS, o Hyper-V activo","Activar VT-x/AMD-V; desactivar Hyper-V"],["<code>Timed out while waiting for the machine to boot<\/code>","Equipo lento o primer arranque de Windows","Repetir <code>vagrant up &lt;vm&gt;<\/code>; si sigue, <code>vagrant reload &lt;vm&gt;<\/code>"],["IP host-only «not within the allowed ranges»","VirtualBox 7 solo admite 192.168.56.0/21","Usar 192.168.56.x, o añadir <code>* 0.0.0.0/0<\/code> en <code>/etc/vbox/networks.conf<\/code>"],["<code>/usr/bin/env: 'bash\\r'<\/code>","Scripts <code>.sh<\/code> con finales CRLF","Convertir a LF y <code>vagrant provision &lt;vm&gt;<\/code>"],["Wazuh se detiene o el panel no carga","Poca RAM o descarga interrumpida","Subir <code>siem<\/code> a 6 GB; <code>vagrant destroy -f siem &amp;&amp; vagrant up siem<\/code>"],["El agente no aparece en Wazuh","<code>siem<\/code> apagado al provisionar, agente más nuevo que el manager o puertos 1514/1515","<code>nc -zv 10.10.10.10 1514<\/code>; revisar <code>ossec.log<\/code>; corregir <code>WAZUH_AGENT_VER<\/code>"],["Suricata no genera alertas","Interfaz mal detectada o sin modo promiscuo","Revisar <code>interface:<\/code> en <code>suricata.yaml<\/code>; <code>vagrant reload siem<\/code>"],["<code>win10<\/code> sin IP 10.10.10.20","Vagrant no pudo configurarla por WinRM","<code>New-NetIPAddress -InterfaceAlias \"Ethernet 2\" -IPAddress 10.10.10.20 -PrefixLength 24<\/code>"],["<code>apt update<\/code> falla en Kali por firma","Clave del repositorio caducada","Ya lo corrige <code>kali.sh<\/code>"],["Disco lleno en el anfitrión","Boxes antiguas y VMs huérfanas","<code>vagrant box prune<\/code> y <code>vagrant global-status --prune<\/code>"]]}}</script>

  const inst=Object.fromEntries(M.install.map(i=>[i[0],i]));
  const ic=k=>codeBlock(inst[k][1], inst[k][2]);
  const per=M.per.map(p=>`<details class="act"><summary><span class="anum">${p.n}</span><span class="stit"><span class="t">${p.t}</span><span class="ca">${p.ca}</span></span><span class="chev">${ICON.chev}</span></summary><div class="pbody"><span class="lbl">Script de configuración</span>${codeBlock("provision/"+p.file, M.files[p.file])}<span class="lbl">Paso a paso</span><ol>${p.steps.map(x=>`<li>${x}</li>`).join("")}</ol>${codeBlock("comprobación", p.check)}<div class="note">${ICON.info}<div>${p.note}</div></div></div></details>`).join("");
  return {title:"Manual Vagrant", crumb:["Entorno","Manual Vagrant"], body:`
    <div class="eyebrow">Entorno de trabajo</div>
    <h1>Manual Vagrant</h1>
    <p class="lead">Con un único <span class="mono">Vagrantfile</span> y cuatro scripts se levantan las 4 máquinas con <span class="mono">vagrant up</span>. Todos los puestos quedan idénticos y se reconstruyen en minutos.</p>
    <div class="note">${ICON.info}<div>Los ficheros del laboratorio están en el repositorio <a href="https://github.com/mrnovoa123/CE_ICS_lab_config" target="_blank" rel="noopener"><b>CE_ICS_lab_config</b></a> en GitHub.</div></div>
    <h2 id="que-montar">1. Qué vamos a montar</h2>
    <div class="tbl-wrap"><table><thead><tr><th>VM</th><th>Rol</th><th>Box</th><th>IP LAN</th><th>RAM / CPU</th></tr></thead><tbody>${vms}</tbody></table></div>
    <p>Total: unos 11 GB de RAM. <span class="mono">win10</span> solo se arranca en las actividades que la usan.</p>
    <h2 id="instalacion">2. Instalación en el equipo anfitrión</h2>
    <ol>
      <li><b>Activar la virtualización</b> en la BIOS/UEFI (Intel VT-x o AMD-V). Hacen falta unos 60 GB libres.</li>
      <li><b>Instalar VirtualBox 7.x</b> desde <a href="https://www.virtualbox.org/wiki/Downloads" target="_blank" rel="noopener">virtualbox.org</a> con su <i>Extension Pack</i>.</li>
      <li><b>Instalar Vagrant</b> desde <a href="https://developer.hashicorp.com/vagrant/install" target="_blank" rel="noopener">developer.hashicorp.com/vagrant/install</a>.</li>
    </ol>
    ${ic("bash")}${ic("check")}
    <div class="note warn">${ICON.warn}<div><b>Anfitriones Windows:</b> con Hyper-V, WSL2 o «Plataforma de máquina virtual» activos, VirtualBox va muy lento o no arranca VMs de 64 bits.</div></div>
    ${ic("boxes")}
    <h2 id="comandos">3. Comandos de Vagrant</h2>
    <div class="tbl-wrap"><table><thead><tr><th>Comando</th><th>Qué hace</th></tr></thead><tbody>${cmds}</tbody></table></div>
    <h2 id="config">4. Configuración de cada máquina</h2>
    <p class="lead">Cada tarjeta contiene el script completo, los pasos y la comprobación.</p>
    <div class="acts">${per}</div>
    <h2 id="marcha">5. Puesta en marcha y verificación</h2>
    ${codeBlock("primeira vez", M.start)}
    <h3 id="prueba">Prueba de extremo a extremo</h3>
    <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Desde</th><th>Acción</th><th>Resultado esperado</th></tr></thead><tbody>${e2e}</tbody></table></div>
    <h3 id="snapshots">Snapshots</h3>
    ${codeBlock("instantáneas", M.snap)}
    <h2 id="problemas">6. Problemas frecuentes</h2>
    <div class="tbl-wrap"><table><thead><tr><th>Síntoma</th><th>Causa probable</th><th>Solución</th></tr></thead><tbody>${tr}</tbody></table></div>`};
}
function pgUnit(u){
  const teoria = u.teoria.map(t=>`<h3 id="${slug(t.h)}">${t.h}</h3>${t.html}`).join("");
  const acts = u.acts.map(a=>`<a class="acard" href="#/ud/${u.id}/${a.n}"><span class="an">${a.n}</span><span class="at">${a.t}</span><span class="ac">${a.ca}</span></a>`).join("");
  return {title:u.title, crumb:["Unidades", u.tag], body:`
    <div class="eyebrow" style="color:${u.color}">${u.tag} · ${u.ra}</div>
    <h1>${u.title}</h1>
    <p class="sec-meta">${u.dur} · ${u.peso} · Instrumentos ${u.inst}</p>
    <h2 id="resumen">Resumen</h2>
    <p class="lead">${u.intro}</p>
    <h2 id="contenidos">Contenidos de la unidad</h2>
    ${teoria}
    <h2 id="actividades">Actividades</h2>
    <div class="cardgrid acts-idx">${acts}</div>`};
}
function pgAct(u,a){
  let ia="";
  if(a.ia){
    ia += `<div class="ia"><div class="iah">${ICON.ia}Trabajo con IA</div>`;
    ia += `<span class="lbl" style="color:var(--ia)">Ruta de trabajo</span>${list(a.ia.ruta)}`;
    (a.ia.prompts||[]).forEach(p=> ia += codeBlock(p.who, null, p.lines));
    if(a.ia.ctrl) ia += `<div class="line ctrl"><b>Norma ·</b> ${a.ia.ctrl}</div>`;
    ia += `</div>`;
    const num=u.id.replace("ud","");
    if(a.ia.labId && LAB_TASKS[a.ia.labId]){
      const L=LAB_TASKS[a.ia.labId];
      ia += `<div class="labia"><div class="lh">Laboratorio integrado</div><h3 id="lab-integrado" style="margin-top:6px">${L.t}</h3><p>${L.escenario}</p><div class="lh">Elementos necesarios</div>${list(L.elementos)}<div class="lh">Fases de la tarea</div><ol>${(L.fases||L.pasos).map(x=>`<li>${x}</li>`).join("")}</ol><div class="deliver"><b>Entregable ·</b> ${L.entregable}</div></div>`;
    }
  }
  return {title:`${a.n} · ${a.t}`, crumb:["Unidades", u.tag, a.n], accent:u.color, body:`
    <div class="eyebrow" style="color:${u.color}">${u.tag} · Actividade ${a.n}</div>
    <h1>${a.t}</h1>
    <p class="sec-meta">${a.ca}</p>
    <p class="lead">${a.obj}</p>
    <span class="lbl">Entorno y herramientas</span><div class="chips">${a.tools.map(t=>`<span class="chip">${t}</span>`).join("")}</div>
    <h2 id="tarea">Tarea de aula</h2>
    ${list(a.steps)}
    ${a.code?codeBlock(a.code.who, null, a.code.lines):""}
    <div class="deliver"><b>Entregable ·</b> ${a.deliver}</div>
    <p class="amp"><b>Ampliación ·</b> ${a.amp}</p>
    ${ia}`};
}
function pgEval(){
  const tiles = UNITS.map(u=>`<div class="tile" style="--udc:${u.color}"><div class="k">${u.tag} · ${u.ra}</div><div class="b">${u.peso.replace(' %','%')}</div><div class="d">${u.inst}</div></div>`).join("");
  return {title:"Evaluación", crumb:["Evaluación"], body:`
    <div class="eyebrow">Cierre</div>
    <h1>Evaluación</h1>
    <p class="sec-meta">Ponderación por unidad e instrumentos</p>
    <div class="tiles">${tiles}</div>
    <p class="lead">Instrumentos: <b>Lista de Cotejo (LC)</b> para la calidad del producto técnico y <b>Tabla de Observación (TO)</b> para el proceso y la destreza en las VM. La nota de cada evaluación es la media ponderada de las UD (70 %) más el trabajo diario (30 %); cada UD exige un mínimo de 5. La <b>bitácora de prompts</b> es anexo obligatorio de todo trabajo con IA.</p>`};
}

/* ---------- rutas ---------- */
const ROUTES = {};
const FLAT = [];
function reg(path, fn){ ROUTES[path]=fn; FLAT.push(path); }
reg("/inicio", pgInicio);
reg("/entorno/laboratorio", pgLab);
reg("/entorno/vagrant", pgVagrant);
reg("/entorno/ia", pgIA);
UNITS.forEach(u=>{
  reg("/ud/"+u.id, ()=>pgUnit(u));
  u.acts.forEach(a=> reg(`/ud/${u.id}/${a.n}`, ()=>pgAct(u,a)));
});
reg("/eval", pgEval);

/* ---------- índice lateral ---------- */
function buildSidebar(){
  let h = `<a class="s-item s-top" href="#/inicio" data-r="/inicio">${ICON.book}<span>Inicio</span></a>`;
  h += `<div class="s-group">Entorno</div>`;
  h += `<a class="s-item" href="#/entorno/laboratorio" data-r="/entorno/laboratorio">El laboratorio</a>`;
  h += `<a class="s-item" href="#/entorno/vagrant" data-r="/entorno/vagrant">Manual Vagrant</a>`;
  h += `<a class="s-item" href="#/entorno/ia" data-r="/entorno/ia">Trabajar con IA</a>`;
  h += `<div class="s-group">Unidades didácticas</div>`;
  UNITS.forEach(u=>{
    h += `<div class="s-unit" data-unit="${u.id}" style="--udc:${u.color}">
      <button class="s-uhead" type="button" aria-expanded="false"><span class="s-utag">${u.tag}</span><span class="s-utitle">${u.title}</span><span class="s-caret">${ICON.chev}</span></button>
      <div class="s-children">
        <a class="s-item s-sub" href="#/ud/${u.id}" data-r="/ud/${u.id}">Contenido de la unidad</a>
        ${u.acts.map(a=>`<a class="s-item s-sub s-act" href="#/ud/${u.id}/${a.n}" data-r="/ud/${u.id}/${a.n}"><span class="s-an">${a.n}</span>${a.t}</a>`).join("")}
      </div></div>`;
  });
  h += `<div class="s-group">Cierre</div>`;
  h += `<a class="s-item" href="#/eval" data-r="/eval">Evaluación</a>`;
  $("#sidenav").innerHTML = h;
  document.querySelectorAll(".s-uhead").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const unit = btn.closest(".s-unit");
      const open = unit.classList.toggle("open");
      btn.setAttribute("aria-expanded", open?"true":"false");
    });
  });
}

/* ---------- render ---------- */
function currentPath(){
  let p = location.hash.replace(/^#/,"");
  if(!p || !ROUTES[p]) p = "/inicio";
  return p;
}
function render(){
  const path = currentPath();
  const pg = ROUTES[path]();
  document.title = pg.title==="Incidentes de Ciberseguridad" ? "Laboratorio MP5021" : pg.title+" · MP5021";
  const crumbs = pg.crumb.map((c,i)=> i<pg.crumb.length-1?`<span>${c}</span>`:`<b>${c}</b>`).join('<span class="sep">/</span>');
  const idx = FLAT.indexOf(path);
  const prev = idx>0?FLAT[idx-1]:null, next=idx<FLAT.length-1?FLAT[idx+1]:null;
  const label = p => { const g=ROUTES[p](); return g.crumb[g.crumb.length-1]===g.title?g.title:g.title; };
  let pager = `<nav class="pager">`;
  pager += prev?`<a class="pg prev" href="#${prev}"><span>Anterior</span><b>${ROUTES[prev]().title}</b></a>`:`<span></span>`;
  pager += next?`<a class="pg next" href="#${next}"><span>Siguiente</span><b>${ROUTES[next]().title}</b></a>`:`<span></span>`;
  pager += `</nav>`;
  $("#doc").innerHTML = `<div class="crumbs">${crumbs}</div><article class="prose">${pg.body}</article>${pager}`;
  $("#doc").style.setProperty("--page-accent", pg.accent||"var(--accent)");

  // índice de la página (TOC derecha)
  const heads = [...$("#doc .prose").querySelectorAll("h2, h3")];
  heads.forEach(h=>{ if(!h.id) h.id = slug(h.textContent); });
  const toc = heads.filter(h=>h.id).map(h=>`<a class="toc-${h.tagName.toLowerCase()}" href="#${h.id}" data-target="${h.id}">${h.textContent}</a>`).join("");
  $("#toc").innerHTML = toc ? `<div class="toc-h">En esta página</div>${toc}` : "";
  $("#toc").hidden = !toc;

  // estado del índice lateral
  document.querySelectorAll("#sidenav .s-item").forEach(a=> a.classList.toggle("active", a.dataset.r===path));
  document.querySelectorAll("#sidenav .s-unit").forEach(u=>{
    const inside = path.startsWith("/ud/"+u.dataset.unit);
    if(inside){ u.classList.add("open"); u.querySelector(".s-uhead").setAttribute("aria-expanded","true"); }
  });
  const act = $("#sidenav .s-item.active");
  if(act) act.scrollIntoView({block:"nearest"});
  $("#side").classList.remove("open");
  window.scrollTo(0,0);
  setupToc();
}
let tocObs=null;
function setupToc(){
  if(tocObs) tocObs.disconnect();
  const links = [...document.querySelectorAll("#toc a")];
  if(!links.length) return;
  const map = {};
  links.forEach(l=> map[l.dataset.target]=l);
  tocObs = new IntersectionObserver(ents=>{
    ents.forEach(e=>{ if(e.isIntersecting){ links.forEach(l=>l.classList.remove("on")); map[e.target.id]?.classList.add("on"); } });
  }, {rootMargin:"0px 0px -75% 0px"});
  Object.keys(map).forEach(id=>{ const el=document.getElementById(id); if(el) tocObs.observe(el); });
}

/* ---------- interacciones globales ---------- */
document.addEventListener("click", e=>{
  const b=e.target.closest(".copy"); if(!b) return;
  const txt=b.closest(".code").querySelector("pre").innerText;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{
    const o=b.textContent; b.textContent="copiado ✓"; b.classList.add("ok");
    setTimeout(()=>{b.textContent=o;b.classList.remove("ok");},1400);
  }).catch(()=>{});
});
$("#navToggle").addEventListener("click", ()=> $("#side").classList.toggle("open"));
(function(){
  const root=document.documentElement, tb=$("#themeBtn");
  tb.addEventListener("click", ()=>{
    const cur=root.getAttribute("data-theme");
    const dark = cur? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", dark?"light":"dark");
    try{localStorage.setItem("mp5021-theme", dark?"light":"dark");}catch(e){}
  });
  try{const t=localStorage.getItem("mp5021-theme"); if(t) root.setAttribute("data-theme",t);}catch(e){}
})();
buildSidebar();
window.addEventListener("hashchange", render);
render();
})();

</script>
</body>
</html>
