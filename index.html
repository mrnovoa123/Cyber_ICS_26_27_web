<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Laboratorio MP5021</title>
<meta name="description" content="Módulo MP5021 Incidentes de Ciberseguridad: laboratorio, teoría por unidad y actividades. IES Chan do Monte, curso 2026/2027.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#e9edec;
  --surface:#ffffff;
  --surface-2:#f4f7f6;
  --surface-3:#e7ecea;
  --ink:#12201e;
  --muted:#516360;
  --faint:#7d908c;
  --border:#d8e0dd;
  --border-strong:#bcc9c5;
  --accent:#0c6b63;
  --accent-ink:#085650;
  --accent-soft:#d3e9e6;
  --attack:#b0402a;
  --attack-soft:#f4ddd6;
  --attack-ink:#8f3120;
  --defend:#0c6b63;
  --verde:#2c7a4b;
  --ambar:#9a6708;
  --rojo:#b23125;
  --code-bg:#0e1f1d;
  --code-ink:#d3e3e0;
  --code-faint:#6f8b87;
  --code-accent:#57cfc2;
  --code-attack:#f0a084;
  --code-key:#9ec8ee;
  --code-str:#bfe0a8;
  --shadow:0 1px 2px rgba(18,32,30,.05),0 4px 14px rgba(18,32,30,.05);
  --shadow-lift:0 6px 16px rgba(18,32,30,.10),0 16px 44px rgba(18,32,30,.12);
  --radius:14px;--radius-sm:9px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:"Chivo",var(--sans);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --maxw:1180px;
  --ud1:#0c6b63;--ud2:#9a6708;--ud3:#7b4b9e;--ud4:#1f6f43;--ud5:#a83d5e;--ia:#3560b6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0a1413;--surface:#10201e;--surface-2:#152925;--surface-3:#1d3430;
    --ink:#e5efec;--muted:#9db2ad;--faint:#6d857f;--border:#243d38;--border-strong:#345049;
    --accent:#3fc3b6;--accent-ink:#78ded2;--accent-soft:#123a35;
    --attack:#e8896a;--attack-soft:#39221a;--attack-ink:#f0a488;
    --defend:#3fc3b6;--verde:#5cc088;--ambar:#d5a13c;--rojo:#e0776a;
    --code-bg:#071513;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.35);
    --shadow-lift:0 6px 18px rgba(0,0,0,.45),0 18px 46px rgba(0,0,0,.5);
    --ud1:#3fc3b6;--ud2:#d5a13c;--ud3:#b98ad6;--ud4:#5cc088;--ud5:#e284a0;--ia:#89aef2;
  }
}
:root[data-theme="dark"]{
  --ground:#0a1413;--surface:#10201e;--surface-2:#152925;--surface-3:#1d3430;
  --ink:#e5efec;--muted:#9db2ad;--faint:#6d857f;--border:#243d38;--border-strong:#345049;
  --accent:#3fc3b6;--accent-ink:#78ded2;--accent-soft:#123a35;
  --attack:#e8896a;--attack-soft:#39221a;--attack-ink:#f0a488;
  --defend:#3fc3b6;--verde:#5cc088;--ambar:#d5a13c;--rojo:#e0776a;
  --code-bg:#071513;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.35);
  --shadow-lift:0 6px 18px rgba(0,0,0,.45),0 18px 46px rgba(0,0,0,.5);
  --ud1:#3fc3b6;--ud2:#d5a13c;--ud3:#b98ad6;--ud4:#5cc088;--ud5:#e284a0;--ia:#89aef2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:4rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
h1,h2,h3,h4{font-family:var(--disp);line-height:1.12;letter-spacing:-.015em;margin:0;text-wrap:balance}
a{color:var(--accent-ink)}
code{font-family:var(--mono);font-size:.9em}

/* layout */
.shell{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:255px minmax(0,1fr);gap:0}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;border-right:1px solid var(--border);padding:20px 16px 48px;background:var(--surface)}
.main{min-width:0;padding:0 clamp(16px,4vw,52px) 110px}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border);display:none;padding:14px 16px}.side.open{display:block}}

/* sidebar */
.brand{display:flex;gap:11px;align-items:center;margin-bottom:16px}
.brand .mk{width:30px;height:30px;border-radius:8px;background:var(--accent);flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.brand .mk svg{width:17px;height:17px}
.brand b{font-family:var(--disp);font-size:14.5px;font-weight:700;letter-spacing:0}
.brand span{display:block;font-size:11px;color:var(--faint);font-weight:500}
.iaswitch{display:flex;align-items:center;gap:9px;width:100%;margin:2px 0 14px;padding:9px 11px;cursor:pointer;border:1px solid var(--border);background:var(--surface-2);border-radius:9px;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:500;text-align:left}
.iaswitch:hover{color:var(--ink)}
.iaswitch .pip{width:26px;height:15px;border-radius:99px;background:var(--border-strong);position:relative;flex:none;transition:background .15s}
.iaswitch .pip::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--surface);transition:transform .15s}
.iaswitch[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--ia) 45%,transparent)}
.iaswitch[aria-pressed="true"] .pip{background:var(--ia)}
.iaswitch[aria-pressed="true"] .pip::after{transform:translateX(11px)}
.nav{list-style:none;margin:0;padding:0;font-size:13.5px}
.nav .grp{margin-top:15px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 8px 6px}
.nav a{display:flex;gap:9px;align-items:baseline;text-decoration:none;color:var(--muted);padding:6px 8px;border-radius:7px;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.udh{font-weight:600;color:var(--ink)}
.nav a .n{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none;width:26px}
.nav a.udh .n{color:var(--udc,var(--accent));font-weight:600}

/* topbar mobile */
.topbar{display:none}
@media (max-width:900px){.topbar{display:flex;position:sticky;top:0;z-index:40;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}.topbar b{font-family:var(--disp);font-size:14px}}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
.theme-fixed{position:fixed;right:16px;bottom:16px;z-index:30;box-shadow:var(--shadow-lift)}
@media (max-width:900px){.theme-fixed{display:none}}

/* hero */
.hero{padding:46px 0 26px;border-bottom:1px solid var(--border)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:500;margin-bottom:14px}
.hero h1{font-size:clamp(30px,5.4vw,50px);font-weight:800;letter-spacing:-.03em}
.hero .sub{font-size:clamp(15.5px,2vw,18px);color:var(--muted);max-width:62ch;margin-top:15px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.fact{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted);display:flex;gap:7px;align-items:center;font-variant-numeric:tabular-nums}
.fact b{color:var(--ink);font-weight:700}
.setup-note{margin-top:22px;display:flex;gap:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);border-radius:var(--radius);padding:14px 16px;font-size:14px;color:var(--ink)}
.setup-note svg{width:19px;height:19px;flex:none;color:var(--accent-ink);margin-top:2px}

/* progression flow */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0 6px}
@media (max-width:760px){.flow{grid-template-columns:1fr 1fr}}
@media (max-width:430px){.flow{grid-template-columns:1fr}}
.flow .st{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;border-top:3px solid var(--udc);box-shadow:var(--shadow)}
.flow .st .u{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--udc)}
.flow .st .v{font-family:var(--disp);font-size:18px;font-weight:700;letter-spacing:-.01em;margin:4px 0 3px}
.flow .st .d{font-size:12.5px;color:var(--muted);line-height:1.45}

/* sections */
section{padding-top:40px;scroll-margin-top:4rem}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sec-head .tag{font-family:var(--mono);font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;color:#fff;letter-spacing:.02em}
h2{font-size:clamp(23px,3.1vw,31px);font-weight:700;letter-spacing:-.02em}
.sec-meta{color:var(--faint);font-size:13px;margin:5px 0 20px;font-weight:500;font-family:var(--mono)}
h3{font-size:19px;font-weight:600;margin:32px 0 6px}
h4{font-size:15px;font-weight:600;margin:20px 0 6px;color:var(--ink)}
p{margin:10px 0}
.lead{color:var(--muted)}
.main ul,.main ol{margin:10px 0 14px;padding-left:22px}
.main li{margin:5px 0}

/* diagram */
.diagram{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);margin:18px 0;overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:580px;height:auto}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);margin:16px 0;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px;background:var(--surface)}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
thead th{background:var(--surface-2);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;font-family:var(--mono)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td .mono,th .mono{font-size:12.5px}
.ip{color:var(--accent-ink);font-weight:500;font-family:var(--mono)}
.num{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}

/* code */
.code{position:relative;background:var(--code-bg);border-radius:var(--radius-sm);margin:14px 0;box-shadow:var(--shadow);overflow:hidden}
.code .bar{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.08);gap:10px}
.code .who{font-family:var(--mono);font-size:11px;color:var(--code-faint);letter-spacing:.02em}
.code pre{margin:0;padding:13px 15px;overflow-x:auto;font-family:var(--mono);font-size:12.7px;line-height:1.6;color:var(--code-ink);white-space:pre}
.code.prompt pre{white-space:pre-wrap;word-break:break-word}
.code pre .c{color:var(--code-faint)}
.code pre .p{color:var(--code-accent)}
.code pre .a{color:var(--code-attack)}
.code pre .k{color:var(--code-key)}
.code pre .s{color:var(--code-str)}
.copy{border:1px solid rgba(255,255,255,.16);background:transparent;color:var(--code-faint);font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:6px;cursor:pointer;display:flex;gap:5px;align-items:center;flex:none}
.copy:hover{color:var(--code-ink);border-color:rgba(255,255,255,.32)}
.copy.ok{color:var(--code-accent);border-color:var(--code-accent)}

/* callouts */
.note{display:flex;gap:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px;color:var(--muted);margin:14px 0}
.note svg{width:16px;height:16px;flex:none;color:var(--accent);margin-top:2px}
.note b{color:var(--ink)}
.note.warn{background:var(--attack-soft);border-color:color-mix(in srgb,var(--attack) 30%,transparent)}
.note.warn svg{color:var(--attack)}
.note.fix{background:color-mix(in srgb,var(--verde) 12%,var(--surface));border-color:color-mix(in srgb,var(--verde) 34%,transparent)}
.note.fix svg{color:var(--verde)}

/* semaforo */
.sem{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin:14px 0 6px}
.sem>div{background:var(--surface);padding:12px 15px}
.sem .l{font-weight:600;font-size:14px;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.sem .l::before{content:"";width:11px;height:11px;border-radius:50%;flex:none}
.sem .v .l::before{background:var(--verde)}
.sem .a .l::before{background:var(--ambar)}
.sem .r .l::before{background:var(--rojo)}
.sem p{font-size:13px;margin:0;color:var(--muted)}
.tl{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tl.g{background:var(--verde)}.tl.a{background:var(--ambar)}.tl.r{background:var(--rojo)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;font-family:var(--mono);background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:3px 9px;color:var(--ink)}

/* activity cards */
.acts{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.act{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.act>summary{list-style:none;cursor:pointer;padding:15px 17px;display:flex;gap:14px;align-items:flex-start}
.act>summary::-webkit-details-marker{display:none}
.act .anum{font-family:var(--mono);font-weight:600;font-size:13px;color:#fff;background:var(--udc);border-radius:7px;padding:4px 8px;flex:none;margin-top:1px}
.act .stit{flex:1;min-width:0}
.act .stit .t{display:block;font-family:var(--disp);font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.act .stit .ca{display:block;font-size:12px;color:var(--faint);font-family:var(--mono);margin-top:3px}
.act .chev{flex:none;color:var(--faint);transition:transform .2s;margin-top:4px}
.act .chev svg{width:18px;height:18px;display:block}
.act[open] .chev{transform:rotate(90deg)}
.act .body{padding:2px 17px 20px;border-top:1px solid var(--border)}
.act .body>*:first-child{margin-top:14px}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;display:block;margin:18px 0 6px}
.deliver{background:var(--surface-2);border-left:3px solid var(--udc);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin:14px 0 0;font-size:13.5px}
.deliver b{color:var(--udc)}
.amp{font-size:13.5px;color:var(--muted);margin-top:10px}
.amp b{color:var(--ink)}
.qbox{margin-top:12px;background:var(--attack-soft);border:1px solid color-mix(in srgb,var(--attack) 26%,transparent);border-radius:var(--radius-sm);padding:11px 14px;font-size:13.5px}
.qbox .qh{font-weight:600;color:var(--attack-ink);display:flex;gap:7px;align-items:center;margin-bottom:4px}
.qbox svg{width:15px;height:15px}
.qbox ul{margin:4px 0 0}

/* capa IA */
.ia{margin-top:18px;border:1px solid color-mix(in srgb,var(--ia) 34%,transparent);background:color-mix(in srgb,var(--ia) 7%,var(--surface));border-radius:var(--radius-sm);padding:13px 15px}
.ia .iah{display:flex;gap:7px;align-items:center;font-weight:700;font-family:var(--disp);font-size:14px;color:var(--ia);margin-bottom:2px}
.ia .iah svg{width:15px;height:15px;flex:none}
.ia .line{font-size:13.5px;margin-top:11px;padding-left:11px;border-left:3px solid var(--border-strong)}
.ia .line b{font-weight:600}
.ia .line.risk{border-color:var(--attack)}
.ia .line.risk b{color:var(--attack-ink)}
.ia .line.ctrl{border-color:var(--defend)}
.ia .line.ctrl b{color:var(--defend)}
body.no-ia .ia,body.no-ia .flow,body.no-ia #ia,body.no-ia [data-ia]{display:none}
body.no-ia .nav a[href="#ia"]{display:none}

/* lab-integrada callout inside activity */
.labia{margin-top:18px;border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:2px 15px 14px;background:var(--surface-2)}
.labia .lh{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 2px}

/* stat tiles for eval */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;border-top:3px solid var(--udc);box-shadow:var(--shadow)}
.tile .k{font-family:var(--mono);font-size:11px;color:var(--udc);font-weight:600}
.tile .b{font-family:var(--disp);font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .d{font-size:11.5px;color:var(--muted)}

#vagrant .mono,#vagrant code{overflow-wrap:anywhere}
footer{border-top:1px solid var(--border);margin-top:52px;padding-top:24px;color:var(--faint);font-size:13px}
footer a{color:var(--accent-ink)}
.legal{font-size:12px;margin-top:10px}
.dlrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.dlbtn{display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:500;text-decoration:none;color:var(--ink);border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:8px 13px}
.dlbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.dlbtn svg{width:15px;height:15px}
</style>


<div class="topbar">

      <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg></span>
      <div><b>Incidentes CIB</b><span>MP5021 · Curso de Especialización</span></div>

</div>

</button>
